
name: Generar animación de contribuciones

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generar animación
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hugocrct
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23D4E52C&color_dots=%2309090E,%2331204F,%235B3690,%237C3AED,%2300F0FF

      - name: Publicar animación
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
